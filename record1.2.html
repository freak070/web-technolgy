<!DOCTYPE html>
<html>
<head>
    <title>Text Formatting and Multimedia</title>
</head>
<body>
<center>
    <h2>Text Formatting and Multimedia</h2>
</center>

<table border="1" width="80%" align="center" bgcolor="silver" cellpadding="10"; style="background-color: rgb(112, 112, 112);">
    <center>
    <tr>
        <td>
            <h3>Text Formatting Examples</h3>
            <b>Karpagam(Bold)</b><br><br>
            <i>Web Technology(Italic)</i><br><br>
            <u>Karpagam College of Engineering(Underlined)</u><br><br>
            This is Superscript: 10<sup>2</sup><br><br>
            This is Subscript: H<sub>2</sub>O<br>
            <hr>
            <center><h3>Image Example</h3></center>
            <img src="image.jpeg" alt="Company Logo" width="150" style="border-radius:50%; width:150px; height:150px; object-fit:cover; display:block; margin:0 auto;"><br><br>
            <hr>
            <h3>Hyperlink Example</h3>
            <a href="https://unistk.tech/" target="_blank">Visit Unistk</a><br><br>
            <hr>
            <h3>Video Example</h3>
            <video width="320" height="240" controls>
                <source src="video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <br><br>
            <h3>Audio Example</h3>
            <audio controls>
                <source src="audio.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </td>
    </tr>
</center>
</table>
</body>
</html>
